name: API tests

# Runs the API test suite whenever main is updated (including PR merges).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Java 26 to match the Gradle toolchain in build.gradle.
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      # Provides the Gradle build cache and wrapper validation.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers uses the Docker daemon preinstalled on ubuntu-latest.
      - name: Run API tests
        run: ./gradlew test --tests 'com.akydd.realworld_spring.api.*'

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: build/reports/tests/test/
          if-no-files-found: ignore
