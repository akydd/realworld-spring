services:
  test_db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: admin
      POSTGRES_DB: test-app
    ports:
      - 8096:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d test-app" ]
      interval: 3s
      timeout: 3s
      retries: 10
