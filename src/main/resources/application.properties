spring.application.name=realworld-spring
# Database Connection Settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:8095/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
# Disable Hibernate DDL Auto-Generation (Hand over schema ownership to Flyway)
spring.jpa.hibernate.ddl-auto=none
# Flyway Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Incoming request bodies are unwrapped from their root key (e.g. {"user":{...}}) using each
# request DTO's @JsonRootName. Responses are NOT root-wrapped globally: they carry their envelope
# explicitly (envelope records / a matching top-level field), so the two-key articles list response
# ({"articles":[...],"articlesCount":N}) needs no special handling.
spring.jackson.deserialization.unwrap-root-value=true
# Security
jwt.secret=D3B6ctE5JhMQIlzY4wBueDT5YTZE7YhbiWIUp03I9dE=
# This is 24h in milliseconds.
jwt.expiration=86400000
# Readiness checking
management.health.probes.enabled=true
# Spring Shell: no interactive prompt on a normal (web) launch; commands run only when passed as
# args, e.g. `java -jar app.jar reconcile-counts --spring.main.web-application-type=none`.
spring.shell.interactive.enabled=false
