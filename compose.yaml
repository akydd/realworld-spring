services:
  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: admin
      POSTGRES_DB: app
      PGDATA: /var/lib/postgresql/data
    volumes:
      - app-data:/var/lib/postgresql/data
    ports:
      - 8095:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d app"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  app-data:
